name: Auto Update Navigation Menu JSON

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**/index.html'  # apps/ 하위의 index.html이 추가/변경될 때 감지

jobs:
  update-menu:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Scan HTML files and Update menu.json
        run: |
          python - << 'EOF'
          import os
          import json
          from bs4 import BeautifulSoup

          menu_data = []

          # apps 디렉토리 내부 탐색
          for root, dirs, files in os.walk('apps'):
              for file in files:
                  if file.endswith('index.html'):
                      filepath = os.path.join(root, file)
                      
                      # Firebase 배포 경로에 맞는 URL 생성 (경로 정규화)
                      rel_path = os.path.relpath(filepath, '.').replace('\\', '/')
                      url = '/' + rel_path

                      # HTML 내 <title> 태그에서 영문 타이틀 추출
                      title_text = rel_path
                      try:
                          with open(filepath, 'r', encoding='utf-8') as f:
                              soup = BeautifulSoup(f.read(), 'html.parser')
                              if soup.title and soup.title.string:
                                  title_text = soup.title.string.strip()
                      except Exception as e:
                          print(f"Error reading {filepath}: {e}")

                      menu_data.append({
                          "title": title_text,
                          "url": url
                      })

          os.makedirs('data', exist_ok=True)
          with open('data/menu.json', 'w', encoding='utf-8') as json_file:
              json.dump(menu_data, json_file, ensure_ascii=False, indent=2)

          EOF

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data/menu.json
          if git diff --staged --quiet; then
            echo "No changes in menu.json."
          else
            git commit -m "auto: update navigation menu.json [skip ci]"
            git push
          fi
