name: Deploy Multi-Project Monorepo to Firebase

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 코드 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Node.js 20 설정
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. GCP 마스터 서비스 계정 인증
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SC_MASTER }}'

      # 4. Firebase CLI 설치
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # 5. 빈 폴더 배포 오류 방지용 파일 준비
      - name: Ensure public directories exist
        run: |
          mkdir -p project1-core/landing && touch project1-core/landing/index.html
          mkdir -p project2-scarlet/scarlet-ai && touch project2-scarlet/scarlet-ai/index.html
          mkdir -p project3-qubitbiz/qubit-biz && touch project3-qubitbiz/qubit-biz/index.html
          mkdir -p project4-bizhub/biz-hub && touch project4-bizhub/biz-hub/index.html
          mkdir -p project5-bizgalaxy/biz-galaxy && touch project5-bizgalaxy/biz-galaxy/index.html

      # 6. 각 프로젝트별 타겟 바인딩 및 순차 배포 (개별 isolation 배포)
      - name: Deploy Project 1 (sc-sistarcompany)
        run: |
          firebase use sc-sistarcompany
          firebase target:apply hosting p1 sc-sistarcompany
          firebase deploy --project sc-sistarcompany --only hosting:p1

      - name: Deploy Project 2 (sc-scarletai)
        run: |
          firebase use sc-scarletai
          firebase target:apply hosting p2 sc-scarletai
          firebase deploy --project sc-scarletai --only hosting:p2

      - name: Deploy Project 3 (sc-qubitbiz)
        run: |
          firebase use sc-qubitbiz
          firebase target:apply hosting p3 sc-qubitbiz
          firebase deploy --project sc-qubitbiz --only hosting:p3

      - name: Deploy Project 4 (sc-bizhub)
        run: |
          firebase use sc-bizhub
          firebase target:apply hosting p4 sc-bizhub
          firebase deploy --project sc-bizhub --only hosting:p4

      - name: Deploy Project 5 (sc-sispet)
        run: |
          firebase use sc-sispet
          firebase target:apply hosting p5 sc-sispet
          firebase deploy --project sc-sispet --only hosting:p5
