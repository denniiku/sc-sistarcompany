name: Deploy to Firebase Hosting on PR or Push

on:
  push:
    branches:
      - main
  pull_request:
    types: [closed]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # -------------------------------------------------------------
      # Project 1: sc-bizmodel
      # -------------------------------------------------------------
      - name: Deploy Project 1 (sc-bizmodel)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SC_MASTER }}'
          projectId: sc-bizmodel
          entryPoint: apps/project1-core/landing

      # -------------------------------------------------------------
      # Project 2: sc-bizplanner
      # -------------------------------------------------------------
      - name: Deploy Project 2 (sc-bizplanner)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SC_MASTER }}'
          projectId: sc-bizplanner
          entryPoint: apps/project2-planner/biz-planner

      # -------------------------------------------------------------
      # Project 3: sc-bizitem
      # -------------------------------------------------------------
      - name: Deploy Project 3 (sc-bizitem)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SC_MASTER }}'
          projectId: sc-bizitem
          entryPoint: apps/project3-item/biz-item

      # -------------------------------------------------------------
      # Project 4: sc-bizmaker
      # -------------------------------------------------------------
      - name: Deploy Project 4 (sc-bizmaker)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SC_MASTER }}'
          projectId: sc-bizmaker
          entryPoint: apps/project4-maker/biz-maker

      # -------------------------------------------------------------
      # Project 5: sc-bizgalaxy
      # -------------------------------------------------------------
      - name: Deploy Project 5 (sc-bizgalaxy)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SC_MASTER }}'
          projectId: sc-bizgalaxy
          entryPoint: apps/project5-bizgalaxy/biz-galaxy
