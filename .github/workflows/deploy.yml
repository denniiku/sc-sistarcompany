name: Deploy Multi-Project Monorepo to Firebase

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 코드 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Node.js 20 설정
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. GCP 마스터 서비스 계정 인증
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SC_MASTER }}'

      # 4. Firebase CLI 설치
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # 5. 각 디렉토리 및 필수 index.html 존재 보장
      - name: Ensure public directories exist
        run: |
          mkdir -p project1-core/landing && touch project1-core/landing/index.html
          mkdir -p project2-scarlet/scarlet-ai && touch project2-scarlet/scarlet-ai/index.html
          mkdir -p project3-qubitbiz/qubit-biz && touch project3-qubitbiz/qubit-biz/index.html
          mkdir -p project4-bizhub/biz-hub && touch project4-bizhub/biz-hub/index.html
          mkdir -p project5-bizgalaxy/biz-galaxy && touch project5-bizgalaxy/biz-galaxy/index.html

      # 6. 각 서브 폴더 진입 후 독립 배포 수행
      - name: Deploy Project 1 (sc-sistarcompany)
        run: |
          cd project1-core/landing
          firebase deploy --project sc-sistarcompany --only hosting

      - name: Deploy Project 2 (sc-scarletai)
        run: |
          cd project2-scarlet/scarlet-ai
          firebase deploy --project sc-scarletai --only hosting

      - name: Deploy Project 3 (sc-qubitbiz)
        run: |
          cd project3-qubitbiz/qubit-biz
          firebase deploy --project sc-qubitbiz --only hosting

      - name: Deploy Project 4 (sc-bizhub)
        run: |
          cd project4-bizhub/biz-hub
          firebase deploy --project sc-bizhub --only hosting

      - name: Deploy Project 5 (sc-bizgalaxy)
        run: |
          cd project5-bizgalaxy/biz-galaxy
          firebase deploy --project sc-bizgalaxy --only hosting
