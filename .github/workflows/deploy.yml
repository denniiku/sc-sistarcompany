name: Deploy Multi-Project Monorepo to Firebase

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 코드 가져오기
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Node.js 20 설정
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. GCP 마스터 서비스 계정 인증
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SC_MASTER }}'

      # 4. Firebase CLI 설치
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # 5. 빈 폴더 배포 오류 방지용 기본 파일 생성
      - name: Ensure public directories exist
        run: |
          mkdir -p project1-core/landing && touch project1-core/landing/index.html
          mkdir -p project2-scarlet/scarlet-ai && touch project2-scarlet/scarlet-ai/index.html
          mkdir -p project3-qubitbiz/qubit-biz && touch project3-qubitbiz/qubit-biz/index.html
          mkdir -p project4-bizhub/biz-hub && touch project4-bizhub/biz-hub/index.html
          mkdir -p project5-bizgalaxy/biz-galaxy && touch project5-bizgalaxy/biz-galaxy/index.html

      # 6. 타겟 지정 후 각각의 프로젝트로 배포
      - name: Deploy All Projects to Firebase
        run: |
          firebase target:apply hosting p1 sc-sistarcompany --project sc-sistarcompany
          firebase deploy --project sc-sistarcompany --only hosting:p1

          firebase target:apply hosting p2 sc-scarletai --project sc-scarletai
          firebase deploy --project sc-scarletai --only hosting:p2

          firebase target:apply hosting p3 sc-qubitbiz --project sc-qubitbiz
          firebase deploy --project sc-qubitbiz --only hosting:p3

          firebase target:apply hosting p4 sc-bizhub --project sc-bizhub
          firebase deploy --project sc-bizhub --only hosting:p4

          firebase target:apply hosting p5 sc-sispet --project sc-sispet
          firebase deploy --project sc-sispet --only hosting:p5
