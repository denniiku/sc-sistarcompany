name: Deploy Multi-Project Monorepo to Firebase

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 코드 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Node.js 20 설정
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. GCP 마스터 서비스 계정 인증
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SC_MASTER }}'

      # 4. Firebase CLI 설치
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # 5. 빈 폴더 배포 에러 방지용 index.html 생성 (비어있지 않다면 생략 가능)
      - name: Ensure public directories exist
        run: |
          mkdir -p project1-core/landing && touch project1-core/landing/index.html
          mkdir -p project2-scarlet/scarlet-ai && touch project2-scarlet/scarlet-ai/index.html
          mkdir -p project3-qubitbiz/qubit-biz && touch project3-qubitbiz/qubit-biz/index.html
          mkdir -p project4-bizhub/biz-hub && touch project4-bizhub/biz-hub/index.html
          mkdir -p project5-bizgalaxy/biz-galaxy && touch project5-bizgalaxy/biz-galaxy/index.html

      # 6. 각 폴더별 1:1 파이어베이스 직접 배포
      - name: Deploy Project 1 (sc-sistarcompany)
        run: npx firebase-tools deploy --project sc-sistarcompany --only hosting --public project1-core/landing

      - name: Deploy Project 2 (sc-scarletai)
        run: npx firebase-tools deploy --project sc-scarletai --only hosting --public project2-scarlet/scarlet-ai

      - name: Deploy Project 3 (sc-qubitbiz)
        run: npx firebase-tools deploy --project sc-qubitbiz --only hosting --public project3-qubitbiz/qubit-biz

      - name: Deploy Project 4 (sc-bizhub)
        run: npx firebase-tools deploy --project sc-bizhub --only hosting --public project4-bizhub/biz-hub

      - name: Deploy Project 5 (sc-sispet)
        run: npx firebase-tools deploy --project sc-sispet --only hosting --public project5-bizgalaxy/biz-galaxy
