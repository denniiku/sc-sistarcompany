name: Deploy Multi-Project Monorepo to Firebase

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 깃허브 코드 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Node.js 환경 세팅 (Firebase CLI 최신 호환을 위해 20 버전 적용)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. GCP 마스터 인증 정보 설정 (Secret Key 사용)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SC_MASTER }}'

      # 4. Firebase CLI 설치
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # 5. Firebase Target 바인딩 및 5개 멀티 프로젝트 일괄 배포
      - name: Deploy All Projects to Firebase Hosting
        run: |
          firebase target:apply hosting project1 sc-sistarcompany
          firebase target:apply hosting project2 sc-scarletai
          firebase target:apply hosting project3 sc-qubitbiz
          firebase target:apply hosting project4 sc-bizhub
          firebase target:apply hosting project5 sc-sispet
          
          firebase deploy --only hosting
