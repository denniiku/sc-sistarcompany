name: Deploy Multi-Project Monorepo to Firebase

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 코드 가져오기
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Node.js 20 설정
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. GCP 마스터 서비스 계정으로 인증
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SC_MASTER }}'

      # 4. Firebase CLI 설치
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # 5. Active 프로젝트 지정 후 타겟 매칭 및 전체 배포
      - name: Deploy All Hosting Projects
        run: |
          firebase use project1
          firebase target:apply hosting project1 sc-sistarcompany
          firebase target:apply hosting project2 sc-scarletai
          firebase target:apply hosting project3 sc-qubitbiz
          firebase target:apply hosting project4 sc-bizhub
          firebase target:apply hosting project5 sc-sispet
          
          firebase deploy --only hosting
