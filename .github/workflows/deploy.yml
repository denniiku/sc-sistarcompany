name: Deploy to Firebase Hosting on PR or Push

on:
  push:
    branches:
      - main
  pull_request:
    types: [closed]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-policy: 'latest'

      # -------------------------------------------------------------
      # Project 1: sc-bizmodel
      # -------------------------------------------------------------
      - name: Deploy Project 1 (sc-bizmodel)
        run: |
          cp -r common apps/project1-core/landing/ 2>/dev/null || true
          cp -r data apps/project1-core/landing/ 2>/dev/null || true
          cd apps/project1-core/landing
          echo '{"hosting":{"public":"."}}' > firebase.json
          npx firebase-tools deploy --project sc-bizmodel --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # -------------------------------------------------------------
      # Project 2: sc-bizplanner
      # -------------------------------------------------------------
      - name: Deploy Project 2 (sc-bizplanner)
        run: |
          cp -r common apps/project2-planner/biz-planner/ 2>/dev/null || true
          cp -r data apps/project2-planner/biz-planner/ 2>/dev/null || true
          cd apps/project2-planner/biz-planner
          echo '{"hosting":{"public":"."}}' > firebase.json
          npx firebase-tools deploy --project sc-bizplanner --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # -------------------------------------------------------------
      # Project 3: sc-bizitem
      # -------------------------------------------------------------
      - name: Deploy Project 3 (sc-bizitem)
        run: |
          cp -r common apps/project3-item/biz-item/ 2>/dev/null || true
          cp -r data apps/project3-item/biz-item/ 2>/dev/null || true
          cd apps/project3-item/biz-item
          echo '{"hosting":{"public":"."}}' > firebase.json
          npx firebase-tools deploy --project sc-bizitem --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # -------------------------------------------------------------
      # Project 4: sc-bizmaker
      # -------------------------------------------------------------
      - name: Deploy Project 4 (sc-bizmaker)
        run: |
          cp -r common apps/project4-maker/biz-maker/ 2>/dev/null || true
          cp -r data apps/project4-maker/biz-maker/ 2>/dev/null || true
          cd apps/project4-maker/biz-maker
          echo '{"hosting":{"public":"."}}' > firebase.json
          npx firebase-tools deploy --project sc-bizmaker --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # -------------------------------------------------------------
      # Project 5: sc-bizgalaxy
      # -------------------------------------------------------------
      - name: Deploy Project 5 (sc-bizgalaxy)
        run: |
          cp -r common apps/project5-bizgalaxy/biz-galaxy/ 2>/dev/null || true
          cp -r data apps/project5-bizgalaxy/biz-galaxy/ 2>/dev/null || true
          cd apps/project5-bizgalaxy/biz-galaxy
          echo '{"hosting":{"public":"."}}' > firebase.json
          npx firebase-tools deploy --project sc-bizgalaxy --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
