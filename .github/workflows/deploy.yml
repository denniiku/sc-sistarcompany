name: Deploy Multi-Project Monorepo to Firebase

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 코드 가져오기
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Node.js 20 설정
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. GCP 마스터 서비스 계정 인증
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SC_MASTER }}'

      # 4. Firebase CLI 설치
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # 5. 빈 폴더 배포 오류 방지용 기본 구조 보장
      - name: Ensure public directories exist
        run: |
          mkdir -p project1-core/landing && echo "<h1>Project 1</h1>" > project1-core/landing/index.html
          mkdir -p project2-scarlet/scarlet-ai && echo "<h1>Project 2</h1>" > project2-scarlet/scarlet-ai/index.html
          mkdir -p project3-qubitbiz/qubit-biz && echo "<h1>Project 3</h1>" > project3-qubitbiz/qubit-biz/index.html
          mkdir -p project4-bizhub/biz-hub && echo "<h1>Project 4</h1>" > project4-bizhub/biz-hub/index.html
          mkdir -p project5-bizgalaxy/biz-galaxy

      # 6. 각 프로젝트별 Firebase 배포
      - name: Deploy All Projects to Firebase
        run: |
          firebase deploy --project sc-sistarcompany --only hosting:sc-sistarcompany
          firebase deploy --project sc-scarletai --only hosting:sc-scarletai
          firebase deploy --project sc-qubitbiz --only hosting:sc-qubitbiz
          firebase deploy --project sc-bizhub --only hosting:sc-bizhub
          firebase deploy --project sc-sispet --only hosting:sc-sispet
