name: Deploy Multi-Project Monorepo to Firebase

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 🚀 [추가된 부분] 파이어베이스 배포 전 네비게이션 메뉴 자동 생성!
      - name: Generate Dynamic Navigation
        run: node generate-nav.js

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SC_MASTER }}'

      # -------------------------------------------------------------
      # Project 1: sc-sistarcompany
      # -------------------------------------------------------------
      - name: Deploy Project 1 (sc-sistarcompany)
        run: |
          cp -r common apps/project1-core/landing/ 2>/dev/null || true
          cp -r data apps/project1-core/landing/ 2>/dev/null || true
          cd apps/project1-core/landing
          echo '{"hosting":{"public":"."}}' > firebase.json
          npx firebase-tools deploy --project sc-sistarcompany --only hosting

      # -------------------------------------------------------------
      # Project 2: sc-scarletai
      # -------------------------------------------------------------
      - name: Deploy Project 2 (sc-scarletai)
        run: |
          cp -r common apps/project2-scarlet/scarlet-ai/ 2>/dev/null || true
          cp -r data apps/project2-scarlet/scarlet-ai/ 2>/dev/null || true
          cd apps/project2-scarlet/scarlet-ai
          echo '{"hosting":{"public":"."}}' > firebase.json
          npx firebase-tools deploy --project sc-scarletai --only hosting

      # -------------------------------------------------------------
      # Project 3: sc-qubitbiz
      # -------------------------------------------------------------
      - name: Deploy Project 3 (sc-qubitbiz)
        run: |
          cp -r common apps/project3-qubitbiz/qubit-biz/ 2>/dev/null || true
          cp -r data apps/project3-qubitbiz/qubit-biz/ 2>/dev/null || true
          cd apps/project3-qubitbiz/qubit-biz
          echo '{"hosting":{"public":"."}}' > firebase.json
          npx firebase-tools deploy --project sc-qubitbiz --only hosting

      # -------------------------------------------------------------
      # Project 4: sc-bizhub
      # -------------------------------------------------------------
      - name: Deploy Project 4 (sc-bizhub)
        run: |
          cp -r common apps/project4-bizhub/biz-hub/ 2>/dev/null || true
          cp -r data apps/project4-bizhub/biz-hub/ 2>/dev/null || true
          cd apps/project4-bizhub/biz-hub
          echo '{"hosting":{"public":"."}}' > firebase.json
          npx firebase-tools deploy --project sc-bizhub --only hosting

      # -------------------------------------------------------------
      # Project 5: sc-bizgalaxy
      # -------------------------------------------------------------
      - name: Deploy Project 5 (sc-bizgalaxy)
        run: |
          cp -r common apps/project5-bizgalaxy/biz-galaxy/ 2>/dev/null || true
          cp -r data apps/project5-bizgalaxy/biz-galaxy/ 2>/dev/null || true
          cd apps/project5-bizgalaxy/biz-galaxy
          echo '{"hosting":{"public":"."}}' > firebase.json
          npx firebase-tools deploy --project sc-bizgalaxy --only hosting
