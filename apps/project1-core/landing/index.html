    <style>
        :root {
            --space-black: #050508;
            --cyber-cyan: #00f3ff;
            --scarlet-red: #ff2a2a;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --neon-glow: 0 0 15px rgba(0, 243, 255, 0.4);
            --scarlet-glow: 0 0 20px rgba(255, 42, 42, 0.4);
        }

        /* Base & Reset */
        body {
            background-color: var(--space-black);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            line-height: 1.6;
        }

        h1, h2, h3, h4 {
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 1rem;
        }

        /* Layout Utility */
        .section-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 100px 40px;
            position: relative;
        }

        /* 🚀 Hero Section: The Launchpad */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: radial-gradient(circle at center, rgba(0, 243, 255, 0.08) 0%, transparent 60%);
            position: relative;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px;
            background: linear-gradient(to top, var(--space-black), transparent);
        }

        .engine-core-ui {
            width: 120px;
            height: 120px;
            border: 2px solid var(--cyber-cyan);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--neon-glow);
            margin-bottom: 30px;
            animation: pulse-core 3s infinite alternate;
        }

        @keyframes pulse-core {
            0% { transform: scale(0.95); box-shadow: 0 0 10px rgba(0, 243, 255, 0.2); }
            100% { transform: scale(1.05); box-shadow: 0 0 30px rgba(0, 243, 255, 0.6); }
        }

        .hero h1 {
