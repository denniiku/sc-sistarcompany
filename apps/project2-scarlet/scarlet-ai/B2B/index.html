<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B2B Gateway - Scarlet AI</title>
  
  <link rel="stylesheet" href="../common/common.css">
  
  <style>
    /* B2B 테스트 페이지 전용 임시 스타일 */
    .b2b-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px;
    }
    .hologram-badge {
      display: inline-block;
      padding: 8px 20px;
      background: rgba(0, 243, 255, 0.05);
      border: 1px solid #00f3ff;
      color: #00f3ff;
      border-radius: 50px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      letter-spacing: 3px;
      margin-bottom: 20px;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2), inset 0 0 10px rgba(0, 243, 255, 0.1);
    }
  </style>
</head>
<body>

  <div id="common-header"></div>

  <main class="b2b-container">
    <span class="hologram-badge">B2B MODULE ONLINE</span>
    <h1 style="font-family: 'Orbitron', sans-serif; font-size: 3rem; margin-bottom: 20px; text-shadow: 0 0 20px rgba(255,255,255,0.3);">
      Scarlet AI : B2B Gateway
    </h1>
    <p style="font-size: 1.2rem; color: #94a3b8; max-width: 600px; line-height: 1.6;">
      이 페이지는 Scarlet AI 프로젝트 하위의 B2B 폴더 구조에서<br>
      공통 네비게이션과 푸터가 정상 작동하는지 확인하는 테스트 페이지입니다.
    </p>
  </main>

  <div id="common-footer"></div>
  
  <script src="../common/common.js"></script>

</body>
</html>
