<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>SISTAR B2B Gateway</title>

  <link rel="stylesheet" href="/common/common.css">
  <script src="/common/common.js" defer></script>

  <style>
    /* B2B 테스트 페이지 전용 우주/네온 본문 스타일 */
    .b2b-hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 20px;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 16px;
      background: rgba(0, 243, 255, 0.05);
      border: 1px solid #00f3ff;
      color: #00f3ff;
      border-radius: 4px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 2px;
      margin-bottom: 20px;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
    }

    .b2b-hero h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 3rem;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 16px;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
    }

    .b2b-hero p {
      font-size: 1.2rem;
      color: #94a3b8;
      max-width: 650px;
      line-height: 1.6;
      margin-bottom: 30px;
    }
  </style>
</head>
<body>

  <div id="common-header"></div>

  <main class="b2b-hero">
    <span class="status-badge">SCARLET AI : B2B NODE</span>
    <h1>SISTAR B2B Gateway</h1>
    <p>
      이 페이지는 절대 경로(<code>/common/...</code>)를 사용하여<br>
      에러 없이 완벽하게 네비게이션과 푸터를 불러오는 테스트 노드입니다.
    </p>
  </main>

  <div id="common-footer"></div>

</body>
</html>
