<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 1. 앱 타이틀 (menu.json 및 Navigation Bar 메뉴명으로 자동 노출) -->
  <title>test 2</title>
  
  <!-- 2. 공통 CSS 연결 (하위 폴더 위치이므로 ../ 사용) -->
  <link rel="stylesheet" href="../common/common.css">
  
  <style>
    .app-container {
      max-width: 800px;
      margin: 40px auto;
      padding: 30px;
      text-align: center;
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .status-badge {
      display: inline-block;
      padding: 6px 14px;
      background: #3b82f6;
      color: white;
      border-radius: 20px;
      font-size: 0.875rem;
      font-weight: bold;
      margin-bottom: 15px;
    }
    h1 {
      color: #0f172a;
      margin-bottom: 10px;
    }
    p {
      color: #64748b;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <!-- 3. 공통 Navigation Bar가 동적으로 주입될 컨테이너 -->
  <div id="common-header"></div>

  <!-- 4. 앱 메인 본문 콘텐츠 -->
  <main class="app-container">
    <span class="status-badge">Test Page 2</span>
    <h1>test 2 Project Page</h1>
    <p>새로운 폴더 구조에서도 공통 Navigation Bar와 Footer가 정상 작동하는지 확인하는 두 번째 테스트 페이지입니다.</p>
  </main>

  <!-- 5. 공통 Footer가 주입될 컨테이너 및 공통 스크립트 연결 (../ 사용) -->
  <div id="common-footer"></div>
  <script src="../common/common.js"></script>

</body>
</html>
